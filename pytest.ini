[pytest]
# pytest 配置文件

# 測試檔案的命名模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 測試目錄
testpaths = tests

# 命令列選項
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=remote_server
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    -p no:warnings

# 標記定義
markers =
    unit: 單元測試
    integration: 整合測試
    slow: 執行時間較長的測試
    security: 安全相關測試
    api: API 端點測試
    
# 最小覆蓋率要求
[coverage:run]
source = remote_server
omit = 
    */tests/*
    */venv/*
    */env/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

