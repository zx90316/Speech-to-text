<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#grad)"/>
  
  <!-- VSCC Text -->
  <text x="50%" y="42%" dominant-baseline="middle" text-anchor="middle" 
        font-family="Arial, sans-serif" font-weight="bold" font-size="140" fill="#ffffff" letter-spacing="4">
    VSCC
  </text>
  
  <!-- Separator Line with Node -->
  <line x1="120" y1="280" x2="392" y2="280" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
  <circle cx="256" cy="280" r="12" fill="#38bdf8" />

  <!-- AI Text -->
  <text x="50%" y="68%" dominant-baseline="middle" text-anchor="middle" 
        font-family="Arial, sans-serif" font-weight="bold" font-size="110" fill="#38bdf8" letter-spacing="8">
    AI
  </text>
</svg>